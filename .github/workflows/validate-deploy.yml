name: Validate deployment and application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deployment-scripts:
    name: Deployment script invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate deployment scripts
        run: npm run validate:deploy

      - name: Check documentation whitespace
        run: git diff --check

  application:
    name: Application tests and builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Frontend tests
        run: npm --prefix apps/web run test:run

      - name: Frontend typecheck and build
        run: npm --prefix apps/web run lint && npm --prefix apps/web run build

      - name: Backend tests
        run: npm --prefix apps/server run test:run

      - name: Backend typecheck and build
        run: npm --prefix apps/server run lint && npm --prefix apps/server run build
