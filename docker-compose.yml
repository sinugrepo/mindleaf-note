services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mindleaf
      POSTGRES_USER: mindleaf
      POSTGRES_PASSWORD: devpw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindleaf"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mindleaf
      MINIO_ROOT_PASSWORD: devpw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  minodata:
