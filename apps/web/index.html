<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindleaf</title>
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#05070d" />
    <script>
      // Apply the persisted theme before React paints to avoid a light-mode
      // flash when the OS/browser is already in dark mode.
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('treenote-storage') || 'null');
          const preference = saved?.state?.theme;
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const dark = preference === 'dark' ||
            (preference !== 'light' && systemDark);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch {
          document.documentElement.classList.add('light');
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
