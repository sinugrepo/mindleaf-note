<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindleaf</title>
    <script>
      // Apply the persisted theme before React paints to avoid a light-mode
      // flash when the OS/browser is already in dark mode.
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('treenote-storage') || 'null');
          const preference = saved?.state?.theme;
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const dark = preference === 'dark' ||
            (preference !== 'light' && systemDark);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
